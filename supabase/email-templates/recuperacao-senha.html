<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recupere sua senha do VIVECI</title>
  </head>
  <body style="margin:0;background:#070A10;color:#F4F5F7;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#070A10;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;background:#0D111A;border:1px solid #202735;border-radius:16px;">
            <tr>
              <td style="padding:40px 36px 18px;text-align:center;">
                <div style="font-size:20px;font-weight:700;letter-spacing:9px;color:#F4F5F7;">VIVECI</div>
                <div style="width:40px;height:2px;margin:22px auto 0;background:#0066FF;"></div>
              </td>
            </tr>
            <tr>
              <td style="padding:14px 36px 8px;text-align:center;">
                <h1 style="margin:0;font-size:28px;line-height:1.2;color:#F4F5F7;">Crie uma nova senha.</h1>
                <p style="margin:18px 0 0;font-size:15px;line-height:1.7;color:#BFC3CA;">
                  Recebemos uma solicitação para redefinir a senha da sua conta. Use o botão abaixo para continuar com segurança.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:26px 36px 30px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;min-width:220px;padding:15px 24px;border-radius:12px;background:#0066FF;color:#FFFFFF;font-size:14px;font-weight:700;text-decoration:none;">
                  Redefinir minha senha
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 36px 34px;text-align:center;">
                <p style="margin:0;font-size:12px;line-height:1.6;color:#7E8795;">
                  Se você não solicitou uma nova senha, ignore este e-mail. Sua senha atual continuará funcionando.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:22px 36px;border-top:1px solid #202735;text-align:center;">
                <p style="margin:0;font-size:10px;font-weight:700;letter-spacing:3px;color:#545B68;">TREINE · EVOLUA · CONQUISTE</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
